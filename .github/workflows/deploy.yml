# One-click deploy to GitHub Pages: Actions → "Deploy to GitHub Pages" → Run workflow.
# First time only: repo Settings → Pages → Source = "GitHub Actions".
name: Deploy to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: pages
        uses: actions/configure-pages@v5
      - run: bun install --frozen-lockfile
      - name: Build static site
        shell: bash
        run: |
          set -o pipefail
          bun run build 2>&1 | tee build.log
        env:
          GITHUB_PAGES: "true"
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Save build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-build-log
          path: build.log
          if-no-files-found: ignore
      - name: SPA fallback + no Jekyll
        run: |
          test -s dist/client/index.html || { echo "::error::The static homepage was not generated. See github-pages-build-log."; exit 1; }
          cp dist/client/index.html dist/client/404.html
          touch dist/client/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist/client }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
